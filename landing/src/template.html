<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妙语连珠 · Chinese Crossword</title>
<meta name="description" content="妙语连珠: an endless Chinese crossword of 成语, 俗语, 谚语 and 歇后语, with meanings read aloud. Free, no ads, in 简体 or 繁體.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=LXGW+WenKai+TC:wght@700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: a hanging scroll on rice paper. Ink for text, cinnabar seal for action, jade for "correct". */
  --paper:#f3ead6; --paper-deep:#e8d9b9; --silk:#fbf5e8;
  --ink:#2a1e14; --ink-soft:#5f4a30; --cinnabar:#b0301f; --cinnabar-deep:#86200f; --jade:#2f6b45; --gold:#c8952e;
  --display:"Ma Shan Zheng","Noto Serif SC",serif;
  --body:"Noto Serif SC","Songti SC","STSong",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 18% 12%,rgba(255,255,255,.55),transparent 42%),radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.4px);background-size:auto,22px 22px}
img{max-width:100%;display:block}
a{color:var(--cinnabar)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.wrap{width:min(1160px,100% - 32px);margin-inline:auto}
.brush{font-family:var(--display);font-weight:400}
html[lang="zh-Hant"] .brush{font-family:"LXGW WenKai TC","Noto Serif SC",serif;font-weight:700}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(243,234,214,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(120,90,50,.18)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:2px;white-space:nowrap}
html[lang="zh-Hant"] .brand b{font-family:"LXGW WenKai TC",serif;font-weight:700;font-size:25px}
.brand b em{font-style:normal;color:var(--cinnabar)}
.langs{display:flex;border:1.5px solid rgba(95,74,48,.35);border-radius:999px;padding:3px;gap:2px;background:var(--silk)}
.langs button{font:inherit;font-size:14px;font-weight:700;border:0;background:none;color:var(--ink-soft);padding:4px 11px;border-radius:999px;cursor:pointer;min-height:32px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--silk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:900;text-decoration:none;border-radius:14px;transition:transform .15s,box-shadow .15s}
.btn-play{background:linear-gradient(#c23a26,var(--cinnabar-deep));color:#fff7e8;box-shadow:0 4px 0 #5e160a,0 10px 22px rgba(134,32,15,.28)}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 6px 0 #5e160a,0 14px 26px rgba(134,32,15,.32)}
.btn-play:active{transform:translateY(2px);box-shadow:0 2px 0 #5e160a}
.btn-sm{font-size:15px;padding:8px 16px;min-height:40px}
.btn-lg{font-size:22px;padding:16px 30px;min-height:60px}
.btn-lg svg{width:22px;height:22px}

/* hero */
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;gap:48px;align-items:center}
@media (min-width:920px){.hero .wrap{grid-template-columns:1.05fr .95fr}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-soft);letter-spacing:1px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe6,#ecc361 55%,#a8741a)}
.hero h1{font-size:clamp(36px,5.6vw,64px);font-weight:900;margin:14px 0 18px;letter-spacing:.5px}
html[lang^="zh"] .hero h1{letter-spacing:4px}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);color:var(--ink-soft);max-width:34em;margin:0 0 28px}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.note{font-size:14px;color:var(--ink-soft);margin:14px 0 0}
.soon{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--jade);border:1.5px dashed rgba(47,107,69,.5);border-radius:999px;padding:6px 14px;background:rgba(220,239,217,.45)}
.soon svg{width:18px;height:18px}

/* the hanging scroll */
.stage{position:relative;display:flex;justify-content:center;padding:0 0 24px}
.scroll{position:relative;width:min(330px,72vw)}
.rod{position:relative;height:18px;border-radius:9px;background:linear-gradient(#7a5233,#3e2716 55%,#6b4628);box-shadow:0 3px 6px rgba(40,25,10,.35);margin:0 -14px;z-index:2}
.rod::before,.rod::after{content:"";position:absolute;top:-3px;width:14px;height:24px;border-radius:5px;background:linear-gradient(#e6c06a,#a8741a)}
.rod::before{left:-10px}.rod::after{right:-10px}
.mount{background:var(--silk);padding:16px 14px 22px;box-shadow:0 18px 40px rgba(60,40,20,.25);border-left:6px solid #d9c49a;border-right:6px solid #d9c49a;transform-origin:top;animation:unroll 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes unroll{from{clip-path:inset(0 0 82% 0)}to{clip-path:inset(0 0 0 0)}}
.rod.bottom{animation:drop 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes drop{from{transform:translateY(-470px)}to{transform:none}}
.painting{height:470px;border:1px solid rgba(120,90,50,.25);overflow:hidden}
.painting img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.cap{margin-top:10px;text-align:center;font-size:13px;color:var(--ink-soft);letter-spacing:2px}
.vtitle{position:absolute;top:44px;right:calc(50% - min(330px,72vw)/2 - 64px);writing-mode:vertical-rl;font-size:54px;letter-spacing:10px;color:var(--ink);display:flex;align-items:center;gap:14px;text-shadow:0 2px 0 rgba(255,250,235,.8)}
.vtitle em{font-style:normal;color:var(--cinnabar)}
.phone{position:absolute;z-index:3;left:calc(50% - min(330px,72vw)/2 - 70px);bottom:-6px;width:200px;padding:8px;border-radius:30px;background:#1f1a16;box-shadow:0 24px 40px rgba(40,25,10,.35);transform:rotate(-4deg)}
.phone img{border-radius:23px;aspect-ratio:390/844;object-fit:cover}
@media (max-width:620px){.vtitle{font-size:40px;right:-6px;top:30px;letter-spacing:6px}.phone{width:150px;left:-6px;padding:6px;border-radius:24px}.phone img{border-radius:19px}.painting{height:400px}@keyframes drop{from{transform:translateY(-400px)}to{transform:none}}}

/* numbers */
.facts{border-block:1px solid rgba(120,90,50,.22);background:rgba(251,245,232,.6)}
.facts .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
@media (min-width:820px){.facts .wrap{grid-template-columns:1.3fr 1fr 1fr 1fr 1fr}}
.fact{padding:22px 18px;border-left:1px solid rgba(120,90,50,.16)}
.fact:first-child{border-left:0}
.fact strong{display:block;font-size:clamp(30px,3.4vw,42px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.fact:first-child strong{color:var(--cinnabar)}
.fact span{font-size:14px;color:var(--ink-soft)}
@media (max-width:819px){.fact:nth-child(odd){border-left:0}.fact{border-top:1px solid rgba(120,90,50,.16)}.fact:first-child{grid-column:1/-1;border-top:0}}

section{padding:80px 0}
.sec-h{font-size:clamp(28px,3.4vw,40px);font-weight:900;margin-bottom:12px;letter-spacing:1px}
html[lang^="zh"] .sec-h{letter-spacing:4px}
.sec-p{color:var(--ink-soft);max-width:38em;margin:0 0 36px}

/* features: ruled list, not cards */
.feats{display:grid;gap:0 48px;grid-template-columns:1fr}
@media (min-width:640px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.feats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.feat{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:24px 0;border-top:1px solid rgba(120,90,50,.22)}
.feat .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--silk);box-shadow:inset 0 0 0 1px rgba(168,116,26,.3);color:var(--ink)}
.feat .ic svg{width:24px;height:24px}
.feat h3{font-size:20px;font-weight:900;margin-bottom:6px}
.feat p{margin:0;font-size:16px;color:var(--ink-soft)}
.promise{margin-top:28px;display:inline-block;font-weight:700;font-size:15px;color:var(--jade);letter-spacing:1px}

/* gallery */
.gallery-sec{background:linear-gradient(var(--paper-deep),var(--paper));}
.gallery{display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 16px 26px;margin:0 -16px;scrollbar-width:thin}
.shot{flex:none;width:230px;scroll-snap-align:center;margin:0;display:flex;flex-direction:column;gap:14px}
.shot .frame{padding:8px;border-radius:32px;background:#1f1a16;box-shadow:0 16px 30px rgba(40,25,10,.25)}
.shot img{border-radius:25px;aspect-ratio:390/844;object-fit:cover;width:100%}
.shot figcaption{font-weight:700;font-size:16px;text-align:center}
.shot:first-child{margin-left:auto}.shot:last-child{margin-right:auto}

/* how to play */
.steps{display:grid;gap:28px;grid-template-columns:1fr;counter-reset:s}
@media (min-width:860px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{background:var(--silk);border-radius:20px;padding:26px 24px;box-shadow:0 1px 0 rgba(120,90,50,.2)}
.step .num{font-family:var(--display);font-size:40px;color:var(--cinnabar);line-height:1}
html[lang="zh-Hant"] .step .num{font-family:"LXGW WenKai TC",serif}
.step h3{font-size:20px;font-weight:900;margin:8px 0 6px}
.step p{margin:0;font-size:16px;color:var(--ink-soft)}
.demo{display:flex;gap:6px;margin:4px 0 18px;min-height:56px;align-items:center;flex-wrap:wrap}
.cell{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:26px;background:#f7edd4;box-shadow:inset 0 0 0 1.5px #d8bf8c;color:var(--ink)}
.cell.blank{background:#fff;box-shadow:inset 0 0 0 2px #d8bf8c}
.cell.sel{background:#ffe08a;box-shadow:0 0 0 3px var(--gold),0 0 12px rgba(200,149,46,.55)}
.cell.hl{background:#fff1c4}
.cell.ok{background:#d4ecc9;color:var(--jade);box-shadow:inset 0 0 0 1.5px #9fcb98}
.tile{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:26px;background:linear-gradient(#fffdf5,#efe2c2);color:var(--cinnabar-deep);box-shadow:0 4px 0 #b08d4f}
.tile.up{transform:translateY(-8px);box-shadow:0 10px 0 #b08d4f;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px);box-shadow:0 6px 0 #b08d4f}}
.bubble{font-size:13px;line-height:1.5;color:var(--ink);background:#fff;border-left:4px solid var(--gold);border-radius:8px;padding:6px 10px;margin-top:6px;width:100%}

/* seasons */
.seasons{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:860px){.seasons{grid-template-columns:repeat(4,minmax(0,1fr))}}
.season{position:relative;margin:0;border-radius:6px;overflow:hidden;aspect-ratio:3/4.4;box-shadow:0 14px 28px rgba(60,40,20,.2);border:6px solid var(--silk)}
.season img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.season figcaption{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:8px;background:rgba(251,245,232,.82)}
.season figcaption b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;color:var(--ink)}
html[lang="zh-Hant"] .season figcaption b{font-family:"LXGW WenKai TC",serif;font-weight:700}
.season figcaption span{font-size:12px;font-weight:700;color:var(--ink-soft)}

/* faq */
.faq{display:grid;gap:0 48px;grid-template-columns:1fr}
@media (min-width:860px){.faq{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa{padding:22px 0;border-top:1px solid rgba(120,90,50,.22)}
.qa h3{font-size:19px;font-weight:900;margin-bottom:6px}
.qa p{margin:0;color:var(--ink-soft);font-size:16px}

/* final */
.final{position:relative;padding:0;margin:40px 0 0}
.final .art{position:relative;min-height:440px;display:grid;place-items:center;overflow:hidden}
.final .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 52%}
.final .panel{position:relative;text-align:center;background:rgba(251,245,232,.88);border-radius:22px;padding:34px 36px;margin:40px 16px;box-shadow:0 18px 40px rgba(40,25,10,.25);display:flex;flex-direction:column;align-items:center;gap:18px}
.final h2{font-size:clamp(28px,3.6vw,40px);font-weight:900}
footer{padding:30px 0 40px;font-size:14px;color:var(--ink-soft)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
@media (max-width:520px){.bar .btn-sm{display:none}.brand b{font-size:24px}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="妙语连珠">__SEAL40__<b>妙语<em>连珠</em></b></a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="s" aria-pressed="false" lang="zh-Hans">简</button>
      <button type="button" data-lang="t" aria-pressed="false" lang="zh-Hant">繁</button>
    </div>

<main id="top">
<section class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow"><i aria-hidden="true"></i><span data-i18n="eyebrow"></span></span>

      <p class="lead" data-i18n="hero_p"></p>
      <div class="cta-row">
        <a class="btn btn-play btn-lg" data-app href="__APP__"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span data-i18n="cta"></span></a>
        <span class="soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg><span data-i18n="android"></span></span>
      </div>

    <div class="stage" aria-hidden="true">
      <div class="scroll">

      <div class="phone"><img data-shot="play" src="img/s-play.webp" alt=""></div>
    </div>
  </div>
</section>

<div class="facts">
  <div class="wrap">
    <div class="fact"><strong>1,024</strong><span data-i18n="stat_total"></span></div>
    <div class="fact"><strong>774</strong><span data-i18n="stat_idiom"></span></div>
    <div class="fact"><strong>203</strong><span data-i18n="stat_saying"></span></div>
    <div class="fact"><strong>47</strong><span data-i18n="stat_xhy"></span></div>
    <div class="fact"><strong>∞</strong><span data-i18n="stat_levels"></span></div>
  </div>
</div>

<section>
  <div class="wrap">
    <h2 class="sec-h" data-i18n="feat_h"></h2>
    <div class="feats">
      <div class="feat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8.5c-2 0-3.5 1.6-3.5 3.5S5 15.5 7 15.5c3.5 0 6.5-7 10-7 2 0 3.5 1.6 3.5 3.5S19 15.5 17 15.5c-3.5 0-6.5-7-10-7z"/></svg></div><div><h3 data-i18n="f1_h"></h3><p data-i18n="f1_p"></p></div></div>
      <div class="feat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.6C10.4 5.1 7.9 4.6 4 4.6v13c3.9 0 6.4.5 8 2 1.6-1.5 4.1-2 8-2v-13c-3.9 0-6.4.5-8 2z"/><path d="M12 6.6v13"/></svg></div><div><h3 data-i18n="f2_h"></h3><p data-i18n="f2_p"></p></div></div>
      <div class="feat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3l4.5-4v13L7 14.5H4z"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></div><div><h3 data-i18n="f3_h"></h3><p data-i18n="f3_p"></p></div></div>
      <div class="feat"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="900" fill="currentColor" font-family="Noto Serif SC,serif">文</text></svg></div><div><h3 data-i18n="f4_h"></h3><p data-i18n="f4_p"></p></div></div>
      <div class="feat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 18.5l6-8.5 3.5 5 2.5-3.5 7 7z"/><circle cx="17" cy="6.5" r="2"/></svg></div><div><h3 data-i18n="f5_h"></h3><p data-i18n="f5_p"></p></div></div>
      <div class="feat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5M8 10.5h5M10.5 8v5"/></svg></div><div><h3 data-i18n="f6_h"></h3><p data-i18n="f6_p"></p></div></div>
    </div>
    <span class="promise" data-i18n="promise"></span>
  </div>
</section>

<section class="gallery-sec">
  <div class="wrap">
    <h2 class="sec-h" data-i18n="gal_h"></h2>
    <div class="gallery" tabindex="0" aria-label="Screenshots">
      <figure class="shot"><div class="frame"><img data-shot="play" src="img/s-play.webp" alt="" loading="lazy"></div><figcaption data-i18n="g_play"></figcaption></figure>
      <figure class="shot"><div class="frame"><img data-shot="meaning" src="img/s-meaning.webp" alt="" loading="lazy"></div><figcaption data-i18n="g_meaning"></figcaption></figure>
      <figure class="shot"><div class="frame"><img data-shot="season3" src="img/s-season3.webp" alt="" loading="lazy"></div><figcaption data-i18n="g_season"></figcaption></figure>
      <figure class="shot"><div class="frame"><img data-shot="win" src="img/s-win.webp" alt="" loading="lazy"></div><figcaption data-i18n="g_win"></figcaption></figure>
      <figure class="shot"><div class="frame"><img data-shot="book" src="img/s-book.webp" alt="" loading="lazy"></div><figcaption data-i18n="g_book"></figcaption></figure>
      <figure class="shot"><div class="frame"><img src="img/chooser.webp" alt="" loading="lazy"></div><figcaption data-i18n="g_chooser"></figcaption></figure>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 class="sec-h" data-i18n="how_h"></h2>
    <div class="steps">
      <div class="step"><div class="num">一</div>
        <div class="demo" aria-hidden="true"><span class="cell hl">一</span><span class="cell blank sel"></span><span class="cell hl" data-zh="风|風">风</span><span class="cell hl" data-zh="顺|順">顺</span></div>
        <h3 data-i18n="h1_h"></h3><p data-i18n="h1_p"></p></div>
      <div class="step"><div class="num">二</div>
        <div class="demo" aria-hidden="true"><span class="tile" data-zh="满|滿">满</span><span class="tile up">帆</span><span class="tile" data-zh="顺|順">顺</span><span class="tile" data-zh="船|船">船</span></div>

<script>
const I18N = __I18N__;
// On GitHub Pages the game sits next to this page (../www/); elsewhere use the published game link.
const APP_URL = location.hostname.endsWith('github.io') ? '../www/' : '__APP__';
document.querySelectorAll('[data-app]').forEach(a => { a.href = APP_URL; });
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const TITLES = { en: '妙语连珠 · Chinese Crossword', s: '妙语连珠 · 成语填字游戏', t: '妙語連珠 · 成語填字遊戲' };
function setLang(l) {
  const html = document.documentElement;
  html.lang = l === 'en' ? 'en' : l === 's' ? 'zh-Hans' : 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = I18N[el.dataset.i18n]; if (v) el.textContent = v[l] || v.en; });
  document.querySelectorAll('[data-shot]').forEach(img => { img.src = `img/${l === 't' ? 't' : 's'}-${img.dataset.shot}.webp`; });
  document.querySelectorAll('[data-zh]').forEach(el => { const [s, t] = el.dataset.zh.split('|'); el.textContent = l === 't' ? t : s; });
  document.querySelectorAll('.brand b, .vtitle').forEach(el => { el.firstChild.nodeValue = l === 't' ? '妙語' : '妙语'; const em = el.querySelector('em'); if (em) em.textContent = l === 't' ? '連珠' : '连珠'; });
  document.querySelectorAll('footer .brush').forEach(el => { el.textContent = l === 't' ? '妙語連珠' : '妙语连珠'; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  document.title = TITLES[l];
  store.set('myl-lang', l);
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
const saved = store.get('myl-lang');
const nav = (navigator.language || 'en').toLowerCase();
setLang(saved || (/^zh-(tw|hk|mo)|hant/.test(nav) ? 't' : nav.startsWith('zh') ? 's' : 'en'));
</script>
